name: CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-restore --no-build -c Release

  publish:
    name: Publish (${{ matrix.rid }})
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            asset: maz-linux-x64
            binary: maz
          - rid: linux-arm64
            asset: maz-linux-arm64
            binary: maz
          - rid: win-x64
            asset: maz-win-x64.exe
            binary: maz.exe
          - rid: win-arm64
            asset: maz-win-arm64.exe
            binary: maz.exe
          - rid: osx-x64
            asset: maz-osx-x64
            binary: maz
          - rid: osx-arm64
            asset: maz-osx-arm64
            binary: maz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: |
          dotnet publish Console/Console.csproj \
            --self-contained true \
            -r ${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:InformationalVersion=${{ env.VERSION }} \
            -c Release \
            -o ./publish

      - name: Stage asset
        run: mv ./publish/${{ matrix.binary }} ./${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/extract-changelog.sh "$VERSION" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          body_path: release-notes.md

  install-smoke-test:
    name: Install smoke test (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: win-x64 / PS 5.1
            ps_shell: powershell
            ps_version: 5
          - runner: windows-latest
            name: win-x64 / PS 7
            ps_shell: pwsh
            ps_version: 7
          - runner: windows-11-arm
            name: win-arm64 / PS 5.1
            ps_shell: powershell
            ps_version: 5
          - runner: windows-11-arm
            name: win-arm64 / PS 7
            ps_shell: pwsh
            ps_version: 7
          - runner: ubuntu-latest
            name: linux-x64
          - runner: ubuntu-24.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check PowerShell version (Windows, PS 5.1)
        if: runner.os == 'Windows' && matrix.ps_shell == 'powershell'
        shell: powershell
        run: |
          $major = $PSVersionTable.PSVersion.Major
          if ($major -ne ${{ matrix.ps_version }}) {
            Write-Error "Expected PowerShell ${{ matrix.ps_version }}.x but got $major.x"
            exit 1
          }
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Check PowerShell version (Windows, PS 7)
        if: runner.os == 'Windows' && matrix.ps_shell == 'pwsh'
        shell: pwsh
        run: |
          $major = $PSVersionTable.PSVersion.Major
          if ($major -ne ${{ matrix.ps_version }}) {
            Write-Error "Expected PowerShell ${{ matrix.ps_version }}.x but got $major.x"
            exit 1
          }
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Install (Windows, PS 5.1)
        if: runner.os == 'Windows' && matrix.ps_shell == 'powershell'
        shell: powershell
        env:
          MAZ_INSTALL_DIR: ${{ runner.temp }}/maz-bin
        run: irm "https://raw.githubusercontent.com/mauve/maz/$env:GITHUB_REF_NAME/install.ps1" | iex

      - name: Install (Windows, PS 7)
        if: runner.os == 'Windows' && matrix.ps_shell == 'pwsh'
        shell: pwsh
        env:
          MAZ_INSTALL_DIR: ${{ runner.temp }}/maz-bin
        run: irm "https://raw.githubusercontent.com/mauve/maz/$env:GITHUB_REF_NAME/install.ps1" | iex

      - name: Install (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MAZ_INSTALL_DIR: ${{ runner.temp }}/maz-bin
        run: curl -fsSL "https://raw.githubusercontent.com/mauve/maz/$GITHUB_REF_NAME/install.sh" | bash

      - name: Verify (Windows, PS 5.1)
        if: runner.os == 'Windows' && matrix.ps_shell == 'powershell'
        shell: powershell
        run: |
          $bin      = "$env:RUNNER_TEMP/maz-bin/maz.exe"
          $output   = & $bin --version
          $expected = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host $output
          if (-not $output.StartsWith($expected)) {
            Write-Error "Version mismatch: expected output starting with '$expected', got '$output'"
            exit 1
          }

      - name: Verify (Windows, PS 7)
        if: runner.os == 'Windows' && matrix.ps_shell == 'pwsh'
        shell: pwsh
        run: |
          $bin      = "$env:RUNNER_TEMP/maz-bin/maz.exe"
          $output   = & $bin --version
          $expected = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host $output
          if (-not $output.StartsWith($expected)) {
            Write-Error "Version mismatch: expected output starting with '$expected', got '$output'"
            exit 1
          }

      - name: Verify (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          output="$("$RUNNER_TEMP/maz-bin/maz" --version)"
          expected="${GITHUB_REF_NAME#v}"
          echo "$output"
          if [[ "$output" != "$expected"* ]]; then
            echo "error: version mismatch: expected output starting with '$expected', got '$output'" >&2
            exit 1
          fi
